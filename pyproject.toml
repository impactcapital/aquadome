[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aquadome"
version = "0.1.0"
description = "Aerial drone analytics for waterway regulatory compliance (AquaDome / AkuaDome)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",

    # Database / geospatial
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=0.14",
    "pyarrow>=16",          # GeoParquet

    # ML / detection (all Apache-2.0 / MIT)
    "torch>=2.3",
    "torchvision>=0.18",
    "supervision>=0.21",    # roboflow/trackers uses supervision.Detections
    "boxmot>=10",           # roboflow/trackers (BoT-SORT, ByteTrack, OC-SORT) — Apache-2.0

    # OCR — Apache-2.0
    "paddlepaddle>=2.6",
    "paddleocr>=2.7",

    # Provenance / hashing
    "python-jose[cryptography]>=3.3",

    # Utilities
    "click>=8.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-licenses>=4.5",   # license auditing
]
reid = [
    # FastReID (Apache-2.0) — install from source; see scripts/install_fastreid.sh
    "fastreid @ git+https://github.com/JDAI-CV/fast-reid.git",
]
geo-full = [
    "gdal>=3.8",
    "pdal>=3.4",
]
spatial = [
    # Cesium ion REST client
    "httpx>=0.27",
    # STAC catalog generation
    "pystac>=1.10",
    # GeoParquet entity export
    "pyarrow>=16",
    "geopandas>=0.14",
]

[project.scripts]
aquadome-ingest = "aquadome.scripts.ingest_flight:main"
aquadome-seed-gis = "aquadome.scripts.seed_gis_layers:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aquadome"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=aquadome --cov-report=term-missing"
